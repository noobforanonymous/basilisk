name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py

      - name: Build release distributions
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pytest -q
          python -m ruff check . --select E9,F63,F7,F82
          python -m build --no-isolation

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v')
    needs:
      - release-build
    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve exact signed release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets dist
          for attempt in $(seq 1 12); do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-assets \
              --clobber \
              --pattern 'basilisk_ai-*.whl' \
              --pattern 'basilisk_ai-*.tar.gz' \
              --pattern 'basilisk_ai-*.whl.sig' \
              --pattern 'basilisk_ai-*.whl.pem' \
              --pattern 'basilisk_ai-*.tar.gz.sig' \
              --pattern 'basilisk_ai-*.tar.gz.pem' || true
            mapfile -t distributions < <(find release-assets -maxdepth 1 -type f \
              \( -name 'basilisk_ai-*.whl' -o -name 'basilisk_ai-*.tar.gz' \) | sort)
            complete=true
            for distribution in "${distributions[@]}"; do
              test -f "${distribution}.sig" && test -f "${distribution}.pem" || complete=false
            done
            if [ "${#distributions[@]}" -eq 2 ] && [ "$complete" = true ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "The signed Python release assets did not become available" >&2
          exit 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Verify release signatures and stage distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/tags/${RELEASE_TAG}"
          mapfile -t distributions < <(find release-assets -maxdepth 1 -type f \
            \( -name 'basilisk_ai-*.whl' -o -name 'basilisk_ai-*.tar.gz' \) | sort)
          test "${#distributions[@]}" -eq 2
          for distribution in "${distributions[@]}"; do
            test -f "${distribution}.sig" && test -f "${distribution}.pem"
            cosign verify-blob \
              --certificate "${distribution}.pem" \
              --signature "${distribution}.sig" \
              --certificate-identity "$expected_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$distribution"
            cp "$distribution" dist/
          done

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@c7c53464625b32c7a7e944ae62b3e17d2b600130 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
