name: Test Basilisk Action

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'basilisk/**'
  #     - 'action.yml'

jobs:
  test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Basilisk AI Security Scan
        uses: ./
        with:
          target: 'https://basilisk-vulnbot.onrender.com/v1/chat/completions'
          provider: custom
          mode: quick
          fail-on: critical
          output: sarif
