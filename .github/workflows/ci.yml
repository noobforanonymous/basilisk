name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Test
        run: python -m pytest -q
      - name: Audit Python dependencies
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m pip_audit -r requirements-dev.lock --progress-spinner off
      - name: Reject undefined names and syntax errors
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Exercise installed CLI
        run: |
          basilisk --help
          basilisk modules

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.21'
          cache: false
      - run: go test ./...
        working-directory: native/go
      - run: go vet ./...
        working-directory: native/go
      - name: Test C encoder
        run: |
          gcc -O2 -Wall -Wextra -Werror native/c/encoder.c native/c/test_encoder.c \
            -I native/c -o /tmp/basilisk-encoder-test
          /tmp/basilisk-encoder-test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/c/encoder.c native/c/fuzz_encoder.c -I native/c \
            -o /tmp/basilisk-encoder-fuzz
          /tmp/basilisk-encoder-fuzz

  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Prepare CLI benchmark evidence
        run: mkdir -p benchmarks/results/cli
      - name: Run deterministic CLI benchmark
        run: python benchmarks/cli/run.py --repetitions 1 2>&1 | tee benchmarks/results/cli/benchmark.log
        shell: bash
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ground-truth-cli
          path: benchmarks/results/cli/
          if-no-files-found: warn

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Prepare desktop benchmark evidence
        run: mkdir -p benchmarks/results/desktop
      - name: Run desktop smoke test
        working-directory: desktop
        run: xvfb-run --auto-servernum npm run test:e2e 2>&1 | tee ../benchmarks/results/desktop/e2e.log
        shell: bash
      - name: Run desktop ground-truth benchmark
        working-directory: desktop
        run: xvfb-run --auto-servernum npm run benchmark 2>&1 | tee ../benchmarks/results/desktop/benchmark.log
        shell: bash
      - name: Audit all Node dependencies
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Upload desktop benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ground-truth-desktop
          path: benchmarks/results/desktop/
          if-no-files-found: warn

  ground-truth-parity:
    needs: [ground-truth, desktop-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ground-truth-cli
          path: benchmarks/results/cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ground-truth-desktop
          path: benchmarks/results/desktop
      - name: Require exact 46-scenario CLI/Desktop parity
        run: python benchmarks/run_all.py --compare-only
      - name: Upload parity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ground-truth-parity
          path: benchmarks/results/parity.json
          if-no-files-found: error
