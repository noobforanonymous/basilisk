name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Test
        run: python -m pytest -q
      - name: Audit Python dependencies
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m pip_audit -r requirements-dev.lock --progress-spinner off
      - name: Reject undefined names and syntax errors
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Exercise installed CLI
        run: |
          basilisk --help
          basilisk modules

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'
          cache: false
      - run: go test ./...
        working-directory: native/go
      - run: go vet ./...
        working-directory: native/go
      - name: Test C encoder
        run: |
          gcc -O2 -Wall -Wextra -Werror native/c/encoder.c native/c/test_encoder.c \
            -I native/c -o /tmp/basilisk-encoder-test
          /tmp/basilisk-encoder-test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/c/encoder.c native/c/fuzz_encoder.c -I native/c \
            -o /tmp/basilisk-encoder-fuzz
          /tmp/basilisk-encoder-fuzz

  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Run deterministic CLI benchmark
        run: python benchmarks/cli/run.py --repetitions 1
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ground-truth-cli
          path: benchmarks/results/cli/
          if-no-files-found: error

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run desktop smoke test
        working-directory: desktop
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Run desktop ground-truth benchmark
        working-directory: desktop
        run: xvfb-run --auto-servernum npm run benchmark
      - name: Audit all Node dependencies
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Upload desktop benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ground-truth-desktop
          path: benchmarks/results/desktop/
          if-no-files-found: error

  ground-truth-parity:
    needs: [ground-truth, desktop-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ground-truth-cli
          path: benchmarks/results/cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ground-truth-desktop
          path: benchmarks/results/desktop
      - name: Require exact 46-scenario CLI/Desktop parity
        run: python benchmarks/run_all.py --compare-only
      - name: Upload parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ground-truth-parity
          path: benchmarks/results/parity.json
          if-no-files-found: error
